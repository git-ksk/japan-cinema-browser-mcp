name: Finish usage decoupling (temporary)

on:
  push:
    branches:
      - refactor/decouple-mcpusage

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/decouple-mcpusage
      - name: Rewrite provider-specific usage docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('- optionalな `mcp-usage-control` integration（このdeployment例ではFirestore-backed）によるdurable daily budget\n', '- usage accounting / rate limitingはOSS core外のauthenticated deployment boundaryで任意に構成\n')
          s = s.replace('このrepositoryのCloud Run profileではOAuth protocol stateの共有永続storeとしてFirestoreを採用していますが、Firestore自体がMCP OAuthの要件という意味ではありません。`mcp-usage-control` もCinema MCPの必須機能ではなく、任意のusage-control integrationです。詳細は [`docs/CLOUD_RUN.md`](./docs/CLOUD_RUN.md) を参照してください。', 'このrepositoryのCloud Run profileではOAuth protocol stateの共有永続storeとしてFirestoreを採用していますが、Firestore自体がMCP OAuthの要件という意味ではありません。Usage accounting / rate limitingはCinema MCP coreの責務外とし、必要なoperatorがauthenticated deployment boundaryで任意の実装を組み合わせます。詳細は [`docs/CLOUD_RUN.md`](./docs/CLOUD_RUN.md) を参照してください。')
          p.write_text(s)

          p = Path('docs/ARCHITECTURE.md')
          s = p.read_text()
          old = 'Cloud Run profileではOAuth protocol stateの共有永続化にFirestoreを採用していますが、これはOAuth自体の要件ではなくdeployment choiceです。また `mcp-usage-control` はoptional integrationで、このrepositoryではdogfoodingとしてFirestore-backed storeを接続しています。coreは`UsageStore` abstractionを持つため、consumer側ではMemory storeや別のconforming provider-backed storeを選択できます。'
          new = 'Cloud Run profileではOAuth protocol stateの共有永続化にFirestoreを採用していますが、これはOAuth自体の要件ではなくdeployment choiceです。Usage accounting / rate limitingはCinema MCP coreの責務外であり、必要なdeploymentが認証済み境界の外側で任意の実装を組み合わせます。'
          if old not in s:
              raise SystemExit('ARCHITECTURE usage paragraph not found')
          p.write_text(s.replace(old, new))

          p = Path('docs/SECURITY.md')
          s = p.read_text()
          s = s.replace('- optionalなMCPUsageを有効化する場合は、Firebase UIDからderiveしたauthenticated logical principalへbindし、現在のCloud Run profileではFirestore transactionでreserve / liable / settleする\n', '- usage accounting / rate limitingはCinema MCP core外のauthenticated deployment boundaryで実装し、Cinemaのbrowser / handoff execution authorityを変更しない\n')
          s = s.replace('- usage stateへraw credential、page text、Cookie、bearer、payment/auth dataを保存しない\n', '- 外部usage layerへraw credential、page text、Cookie、bearer、payment/auth dataを渡したり保存したりしない\n')
          s = s.replace('- Firestoreは現在のCloud Run implementationでOAuth state / optional usage stateに採用するbackendであり、protocol上の必須要件ではない。代替backendは同等のone-shot / rotation / binding / expiry / atomicity semanticsを維持すること\n', '- Firestoreは現在のCloud Run implementationでOAuth stateに採用するbackendであり、protocol上の必須要件ではない。代替OAuth backendは同等のone-shot / rotation / binding / expiry / atomicity semanticsを維持すること\n')
          p.write_text(s)

          p = Path('docs/CLOUD_RUN.md')
          s = p.read_text()
          for line in [
              'MCP_USAGE_REQUIRED=true\n',
              'MCP_USAGE_FIRESTORE_PROJECT_ID=<gcp-project-id>\n',
              'MCP_USAGE_DAILY_LIMIT=100\n',
              'MCP_USAGE_LEASE_TTL_MS=420000\n',
          ]:
              s = s.replace(line, '')
          s = re.sub(
              r'## MCP usage control\n.*?\n## Free-tier-oriented deployment profile',
              '## Usage accounting and rate limiting\n\nCinema MCP does not define, bundle, or configure a usage-accounting or quota provider. Operators that need quotas, billing guards, or rate limiting should compose them at the authenticated deployment boundary (for example, a gateway or sidecar) using the implementation and storage backend appropriate to their environment.\n\nThat external layer must not receive browser page payloads, credentials, cookies, OAuth bearer material, payment/auth data, or become an alternate execution/replay authority. Cinema MCP remains responsible for its browser, provider-policy, Human Handoff, and purchase-safety boundaries.\n\n## Free-tier-oriented deployment profile',
              s,
              flags=re.S,
          )
          s = s.replace('daily metered browser operations: 100\n', '')
          s = s.replace('plus OAuth/usage-control work', 'plus authentication/proxy overhead')
          s = re.sub(r'\n`MCP_USAGE_LEASE_TTL_MS=420000` intentionally exceeds.*?\n\n', '\n', s, flags=re.S)
          s = re.sub(r'\nThe daily usage budget is an application guardrail,.*?\n\n', '\nUsage quotas and billing guards, when desired, belong to the external authenticated deployment boundary. Cloud Run billing alerts remain recommended regardless of whether such an external control is present.\n\n', s, flags=re.S)
          s = s.replace('The UID is then used to derive the same logical principal used by MCPUsage and handoff ownership.', 'The UID is then used to derive the logical principal used by Cinema request and handoff ownership.')
          p.write_text(s)
          PY
      - name: Audit remaining provider-specific usage coupling
        shell: bash
        run: |
          set -euo pipefail
          : > .usage-audit.tmp
          grep -R -nE 'mcp-usage-control|MCP_USAGE_|MCPUsage' . \
            --exclude-dir=.git \
            --exclude='.usage-audit.tmp' \
            --exclude='refresh-lock-temp.yml' \
            >> .usage-audit.tmp || true
      - name: Commit cleanup and audit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-lock-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: make usage control an external deployment concern"
          git push origin HEAD:refactor/decouple-mcpusage
