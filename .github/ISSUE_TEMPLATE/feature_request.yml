name: 機能提案
description: Browser-first / fail-closedの安全モデルに収まる、範囲の明確な機能を提案します。
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        機能提案は歓迎です。ただしprovider automationは、レビュー済みのpublic UI surface内に限定します。座席操作、checkout、購入、private/internal API、challenge回避、高頻度crawlは別途レビューが必要であり、機能提案を出しただけで自動的に許可されるものではありません。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題・ユースケース
      description: どのようなユーザー課題を解決したいですか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する挙動
      description: 価値が出る最小限のcapabilityと、想定するMCP interfaceを説明してください。
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 対象provider
      options:
        - Provider-neutral
        - TOHOシネマズ
        - イオンシネマ
        - 109シネマズ
        - 複数provider
        - 未定
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全性・コンプライアンス上の考慮事項
      description: navigation、transaction、個人情報、アクセス頻度、challenge、provider policyへの影響など、分かる範囲で記載してください。
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 安全境界の確認
      options:
        - label: 同一domainのURL、hidden endpoint、purchase UIであることだけを理由に、自動化可能なsurfaceとみなしていません。
          required: true
