name: バグ報告
description: MCPサーバーまたはレビュー済みprovider read workflowで再現できる不具合を報告します。
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。credential、Cookie、session token、決済情報、private browsing data、機密情報を含むスクリーンショットは添付しないでください。セキュリティ脆弱性はこのフォームではなく、GitHub Private Vulnerability Reportingから報告してください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ問題が既存のIssueやPull Requestにないことを確認しました。
          required: true
        - label: この報告にcredential、session data、決済情報、脆弱性の詳細を含めていません。
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 影響する範囲
      options:
        - Core / MCP protocol
        - Chrome / CDP runtime
        - TOHOシネマズ read workflow
        - イオンシネマ read workflow
        - 109シネマズ read workflow
        - 複数providerの上映検索・composition
        - ドキュメント / インストール
        - その他
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 実際に起きたこと
      description: 発生した挙動を説明してください。個人情報やsession固有の情報は削除・マスクしてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待していた挙動
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 安全に再現できる最小限の手順を書いてください。購入、決済、credential入力、challenge回避の手順は含めないでください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: OS、Node.js、npm、Chrome/Chromium、MCP client、関連するnon-secret設定を記載してください。
      placeholder: |
        OS:
        Node:
        npm:
        Chrome/Chromium:
        MCP client:
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足情報
      description: ログやスクリーンショットは任意です。不要なpath/usernameをマスクし、機密情報はすべて削除してください。
